<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>村落建造金額計算器</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#d4943a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --page: #efe6d8;
            --surface: #fbf6ee;
            --surface-2: #f3eadc;
            --ink: #3a2a1c;
            --ink-soft: #7a6450;
            --line: #e0d2bd;
            --accent: #d4943a;
            --accent-ink: #2b1906;
            --vault-bg: #f4e2c2;
            --vault-line: #e3c690;
            --vault-ink: #5a3818;
            --vault-soft: #8c6640;
            --vault-strong: #6b3410;
            --stat-bg: #fbf3e4;
            --short: #a0541a;
            --strike: #a88c6a;
            --gold-deep: #a0611f;
            --gold-wash: #f6e7cb;
            --mint: #3f7f4f;
            --rose: #a8322d;
            --rose-wash: #f6e1dc;
            --focus: #b9732a;
            --map-bg: #e6d5b8;
            --map-path: #b38a5c;
            --frame: #8a5a33;
            --frame-inner: #f7ead2;
            --radius-lg: 22px;
            --radius-md: 14px;
            --num: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
            --text: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC",
                "Microsoft JhengHei", "Noto Sans", sans-serif;
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family: var(--text);
            font-size: 16px;
            line-height: 1.55;
            padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        }

        button,
        input,
        select {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        .app {
            max-width: 640px;
            margin: 0 auto;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-text {
            min-width: 0;
        }

        /* Maker badge: a notched ribbon with a crown */
        .maker {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
            padding: 4px 16px 4px 14px;
            background: linear-gradient(180deg, #bd5232 0%, #97391f 100%);
            color: #fff3dc;
            font-size: 12.5px;
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 1.2;
            white-space: nowrap;
            transform: rotate(-3deg);
            transform-origin: left center;
            clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 50%, 100% 100%, 0 100%, 8px 50%);
            box-shadow: inset 0 0 0 1.5px rgba(255, 228, 180, 0.5), inset 0 -3px 0 rgba(80, 22, 8, 0.35);
            text-shadow: 0 1px 0 rgba(80, 22, 8, 0.6);
            user-select: none;
        }

        .maker svg {
            width: 15px;
            height: 15px;
            flex: none;
            fill: #f6c453;
            filter: drop-shadow(0 1px 0 rgba(80, 22, 8, 0.6));
        }

        .brand img {
            width: 40px;
            height: 40px;
            border-radius: 11px;
            flex: none;
        }

        .brand h1 {
            margin: 0;
            font-size: 19px;
            line-height: 1.25;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .lang {
            position: relative;
            flex: none;
        }

        .lang select {
            appearance: none;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 999px;
            padding: 8px 32px 8px 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            max-width: 160px;
        }

        .lang::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 50%;
            width: 7px;
            height: 7px;
            border-right: 2px solid var(--ink-soft);
            border-bottom: 2px solid var(--ink-soft);
            transform: translateY(-70%) rotate(45deg);
            pointer-events: none;
        }

        .subtitle {
            margin: 14px 0 18px;
            color: var(--ink-soft);
            font-size: 15px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* ---------- Tabs ---------- */
        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
        }

        .tab {
            border: 0;
            background: transparent;
            border-radius: 12px;
            padding: 11px 6px;
            font-size: 15px;
            font-weight: 700;
            color: var(--ink-soft);
            cursor: pointer;
            line-height: 1.25;
            transition: background-color .15s, color .15s;
        }

        .tab[aria-selected="true"] {
            background: var(--accent);
            color: var(--accent-ink);
        }

        .tab:not([aria-selected="true"]):hover {
            background: var(--surface-2);
            color: var(--ink);
        }

        /* ---------- Discount chips ---------- */
        .discounts {
            margin: 16px 0 0;
            padding: 0;
            border: 0;
        }

        .discounts legend {
            padding: 0;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--ink-soft);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .chip span {
            display: inline-flex;
            align-items: center;
            min-height: 40px;
            padding: 0 15px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface);
            font-family: var(--num), var(--text);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background-color .15s, border-color .15s;
        }

        .chip input:checked+span {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
        }

        .chip input:focus-visible+span {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        .chip input:disabled+span {
            opacity: .5;
            cursor: not-allowed;
        }

        /* ---------- Panel ---------- */
        .panel {
            margin-top: 16px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 20px;
        }

        .panel[hidden] {
            display: none;
        }

        .panel h2 {
            margin: 0 0 16px;
            font-size: 18px;
            line-height: 1.4;
            font-weight: 800;
        }

        .fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .fields.single {
            grid-template-columns: 1fr;
        }

        .field {
            min-width: 0;
        }

        .field.wide {
            grid-column: 1 / -1;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .stepper {
            display: flex;
            align-items: stretch;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background: var(--surface);
            overflow: hidden;
            transition: border-color .15s, box-shadow .15s;
        }

        .stepper:focus-within,
        .coin-box:focus-within {
            border-color: var(--focus);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent);
        }

        .stepper button {
            flex: none;
            width: 44px;
            border: 0;
            background: var(--surface-2);
            font-size: 22px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            color: var(--ink-soft);
        }

        .stepper button:hover:not(:disabled) {
            color: var(--ink);
        }

        .stepper button:disabled {
            cursor: not-allowed;
            opacity: .45;
        }

        .stepper input,
        .coin-box input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: none;
            background: transparent;
            font-family: var(--num), var(--text);
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            padding: 10px 4px;
            min-height: 54px;
        }

        .stepper input:focus-visible,
        .coin-box input:focus-visible {
            outline: none;
        }

        .coin-box {
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background: var(--surface);
            transition: border-color .15s, box-shadow .15s;
        }

        .coin-box input {
            text-align: left;
            padding: 10px 14px;
        }

        input::placeholder {
            color: var(--ink-soft);
            opacity: .55;
            font-family: var(--text);
            font-size: 16px;
            font-weight: 500;
        }

        input:disabled {
            cursor: not-allowed;
        }

        .peek {
            margin-top: 6px;
            min-height: 1.5em;
            font-size: 13px;
            color: var(--ink-soft);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .peek.bad {
            color: var(--rose);
            font-weight: 700;
        }

        .hint {
            margin: 12px 0 0;
            font-size: 13px;
            color: var(--ink-soft);
        }

        /* ---------- Vault (result) ---------- */
        .vault {
            margin-top: 18px;
            border-radius: 18px;
            padding: 20px;
            background: var(--vault-bg);
            border: 1px solid var(--vault-line);
            color: var(--vault-ink);
        }

        .vault-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--vault-soft);
        }

        .vault-big {
            margin: 2px 0 6px;
            font-family: var(--num), var(--text);
            font-weight: 700;
            font-size: clamp(32px, 9vw, 46px);
            line-height: 1.1;
            color: var(--vault-strong);
            word-break: break-word;
            font-variant-numeric: tabular-nums;
        }

        .vault-big.text {
            font-family: var(--text);
            font-size: clamp(22px, 6vw, 28px);
            font-weight: 800;
            color: var(--vault-strong);
        }

        .vault-line {
            font-size: 14px;
            color: var(--vault-ink);
        }

        .vault-line+.vault-line {
            margin-top: 2px;
        }

        .vault-raw {
            margin-top: 10px;
            font-family: var(--num), var(--text);
            font-size: 13px;
            color: var(--vault-soft);
            word-break: break-all;
        }

        .vault-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            margin-top: 10px;
            font-size: 14px;
        }

        .vault-tags .strike {
            color: var(--strike);
            text-decoration: line-through;
        }

        .vault-tags .saved {
            color: var(--mint);
            font-weight: 700;
        }

        .vault-empty {
            color: var(--vault-soft);
            font-size: 15px;
            padding: 6px 0;
        }

        .vault-empty.bad {
            color: var(--rose);
            font-weight: 700;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            margin-top: 16px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--vault-line);
        }

        .stat {
            background: var(--stat-bg);
            padding: 10px 12px;
            min-width: 0;
        }

        .stat-label {
            font-size: 12px;
            color: var(--vault-soft);
        }

        .stat-value {
            font-weight: 700;
            font-size: 16px;
            line-height: 1.35;
            word-break: break-word;
        }

        .stat-value.short {
            color: var(--short);
        }

        /* ---------- Compare list ---------- */
        .compare {
            margin-top: 16px;
        }

        .compare:empty {
            display: none;
        }

        .compare h3 {
            margin: 0 0 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--ink-soft);
        }

        .compare ul {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .compare li+li {
            border-top: 1px solid var(--line);
        }

        .compare button {
            width: 100%;
            display: grid;
            grid-template-columns: 6.5em 1fr auto;
            align-items: center;
            gap: 10px;
            border: 0;
            background: var(--surface);
            padding: 11px 14px;
            text-align: left;
            cursor: pointer;
        }

        .compare button:hover {
            background: var(--surface-2);
        }

        .compare button[aria-pressed="true"] {
            background: var(--gold-wash);
        }

        .cmp-off {
            font-family: var(--num), var(--text);
            font-weight: 600;
            color: var(--gold-deep);
        }

        .cmp-amt {
            font-family: var(--num), var(--text);
            font-weight: 600;
            font-size: 17px;
            min-width: 0;
            word-break: break-word;
        }

        .cmp-save {
            font-size: 13px;
            color: var(--mint);
            font-weight: 600;
            text-align: right;
        }

        .cmp-tag {
            display: inline-block;
            margin-left: 6px;
            font-family: var(--text);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-ink);
            vertical-align: 2px;
        }

        /* ---------- Status & footer ---------- */
        .status {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--ink-soft);
        }

        .status.error {
            background: var(--rose-wash);
            border-color: transparent;
            color: var(--rose);
        }

        .status[hidden] {
            display: none;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: var(--ink-soft);
            font-size: 12px;
            line-height: 1.7;
        }

        .footer p {
            margin: 0;
        }

        .app {
            padding-bottom: 72px;
        }

        /* ---------- Floating map button ---------- */
        .fab {
            position: fixed;
            right: max(16px, env(safe-area-inset-right));
            bottom: max(16px, env(safe-area-inset-bottom));
            z-index: 40;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 52px;
            padding: 0 20px 0 16px;
            border: 0;
            border-radius: 999px;
            background: var(--frame);
            color: #fff7e8;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(74, 44, 18, 0.32);
        }

        .fab svg {
            width: 22px;
            height: 22px;
        }

        .fab:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---------- Village map ---------- */
        .map {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            background: var(--map-bg);
        }

        .map[hidden] {
            display: none;
        }

        .map-head {
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            padding: max(12px, env(safe-area-inset-top)) 16px 12px;
        }

        .map-head-inner {
            max-width: 560px;
            margin: 0 auto;
        }

        .map-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .map-top h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .map-close {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 999px;
            background: var(--surface-2);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            color: var(--ink);
        }

        .map-search {
            width: 100%;
            min-height: 46px;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background: #fffdf8;
            padding: 0 14px;
            font-size: 16px;
            outline: none;
        }

        .map-search:focus {
            border-color: var(--focus);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent);
        }

        .map-note {
            margin-top: 8px;
            font-size: 13px;
            color: var(--ink-soft);
        }

        .map-note.bad {
            color: var(--rose);
            font-weight: 700;
        }

        .map-suggest {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .map-suggest:empty {
            display: none;
        }

        .map-suggest button {
            border: 1px solid var(--line);
            background: var(--surface-2);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
        }

        .map-scroll {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }

        .map-path {
            max-width: 520px;
            margin: 0 auto;
            padding: 40px 0 120px;
        }

        .map-row {
            position: relative;
            height: 240px;
            /* Skip layout and paint for rows that are off screen (605 rows) */
            content-visibility: auto;
            contain-intrinsic-size: auto 240px;
        }

        .map-link {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .map-link path {
            fill: none;
            stroke: var(--map-path);
            stroke-width: 7;
            stroke-linecap: round;
            stroke-dasharray: 16 14;
        }

        .map-node {
            position: absolute;
            top: 50%;
            left: var(--x);
            transform: translate(-50%, -50%);
            width: 190px;
            text-align: center;
            z-index: 1;
        }

        .diamond {
            position: relative;
            width: 104px;
            height: 104px;
            margin: 0 auto;
            transform: rotate(45deg);
            border-radius: 20px;
            border: 9px solid var(--frame);
            background: linear-gradient(135deg, #fbf2e1 0%, var(--frame-inner) 100%);
            box-shadow: 0 8px 0 rgba(90, 56, 24, 0.25), inset 0 0 0 3px rgba(255, 255, 255, 0.6);
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .diamond span {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            transform: rotate(-45deg);
            font-family: var(--num), var(--text);
            font-weight: 700;
            font-size: 28px;
            color: var(--vault-strong);
        }

        .node-name {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin-top: -14px;
            padding: 4px 12px;
            border-radius: 999px;
            background: var(--frame);
            color: #fff7e8;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .node-price {
            display: table;
            margin: 6px auto 0;
            padding: 0 8px;
            border-radius: 8px;
            background: var(--map-bg);
            font-family: var(--num), var(--text);
            font-weight: 700;
            font-size: 17px;
            color: var(--vault-strong);
        }

        .node-orig {
            display: table;
            margin: 2px auto 0;
            padding: 0 6px;
            border-radius: 6px;
            background: var(--map-bg);
            font-size: 12px;
            color: var(--strike);
            text-decoration: line-through;
        }

        .map-discounts {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .map-discounts button {
            flex: none;
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface);
            font-family: var(--num), var(--text);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .map-discounts button[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
        }

        .node-tag {
            display: inline-block;
            margin-top: 4px;
            padding: 1px 8px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-ink);
            font-size: 11px;
            font-weight: 800;
        }

        .map-row.current .diamond {
            border-color: var(--accent);
        }

        .map-row.hit .diamond {
            box-shadow: 0 8px 0 rgba(90, 56, 24, 0.25), 0 0 0 8px color-mix(in srgb, var(--accent) 45%, transparent);
        }

        .map-row.hit .node-name {
            background: var(--accent);
            color: var(--accent-ink);
        }

        body.map-open {
            overflow: hidden;
        }

        .map-discounts button {
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        /* Motion: transform/opacity only, and only for people who allow it */
        @media (prefers-reduced-motion: no-preference) {
            .map {
                animation: map-in 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .map.is-closing {
                animation: map-out 0.18s ease-in forwards;
            }

            .map-row.hit .diamond {
                animation: diamond-pop 0.45s cubic-bezier(0.3, 1.5, 0.5, 1);
            }

            .map-path.is-swapping .node-price,
            .map-path.is-swapping .node-orig {
                animation: price-swap 0.3s ease;
            }

            .panel:not([hidden]) {
                animation: panel-in 0.22s ease;
            }

            /* results are re-rendered on change, so new numbers ease in */
            .vault-big {
                animation: value-in 0.25s ease;
            }
        }

        @keyframes map-in {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
        }

        @keyframes map-out {
            to {
                opacity: 0;
                transform: translateY(24px);
            }
        }

        @keyframes diamond-pop {
            0% {
                transform: rotate(45deg) scale(1);
            }

            40% {
                transform: rotate(45deg) scale(1.12);
            }

            100% {
                transform: rotate(45deg) scale(1);
            }
        }

        @keyframes price-swap {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
        }

        @keyframes panel-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
        }

        @keyframes value-in {
            from {
                opacity: 0.35;
                transform: translateY(3px);
            }
        }

        @media (max-width: 430px) {
            .brand h1 {
                font-size: 17px;
            }

            .brand img {
                width: 34px;
                height: 34px;
            }

            .lang select {
                max-width: 120px;
            }

            .panel {
                padding: 16px;
            }

            .tab {
                font-size: 14px;
            }

            .fields {
                gap: 10px;
            }

            .stepper button {
                width: 36px;
            }

            .stepper input {
                font-size: 20px;
            }

            .vault {
                padding: 16px;
            }

            .compare button {
                grid-template-columns: 5.6em 1fr;
                row-gap: 0;
            }

            .cmp-save {
                grid-column: 2;
                text-align: left;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="topbar">
            <div class="brand">
                <img src="icon.svg" alt="" />
                <div class="brand-text">
                    <h1 data-i18n="title">村落建造金額計算器</h1>
                    <span class="maker"><svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8Z" />
                        </svg>大佬群CSL製作</span>
                </div>
            </div>
            <div class="lang">
                <label for="languageSelect" class="sr-only" data-i18n="languageLabel">語言</label>
                <select id="languageSelect" disabled>
                    <option value="zh-Hant">中文</option>
                    <option value="en">English</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="th">ไทย</option>
                    <option value="id">Bahasa Indonesia</option>
                    <option value="es">Español</option>
                    <option value="pt">Português</option>
                </select>
            </div>
        </header>

        <p class="subtitle" data-i18n="subtitle">選好折扣，輸入村落與金幣，馬上算出要花多少、能蓋到哪。</p>

        <div class="tabs" role="tablist" id="tabs">
            <button class="tab" role="tab" id="tab-reach" aria-controls="panel-reach" data-tab="reach"
                data-i18n="tabReachable">能蓋到哪村</button>
            <button class="tab" role="tab" id="tab-range" aria-controls="panel-range" data-tab="range"
                data-i18n="tabRange">區間費用</button>
            <button class="tab" role="tab" id="tab-single" aria-controls="panel-single" data-tab="single"
                data-i18n="tabSingle">單村查詢</button>
        </div>

        <fieldset class="discounts">
            <legend data-i18n="discountGroupLabel">建造折扣</legend>
            <div class="chips" id="discountChips"></div>
        </fieldset>

        <div id="status" class="status">正在讀取資料...</div>

        <!-- Reachable -->
        <section class="panel" role="tabpanel" id="panel-reach" aria-labelledby="tab-reach" hidden>
            <h2 data-i18n="reachableTitle">我身上的金幣，可以從現在蓋到哪一村？</h2>
            <div class="fields single">
                <div class="field">
                    <label for="reachVillage" data-i18n="currentVillageInputLabel">目前所在村落</label>
                    <div class="stepper" data-for="reachVillage"></div>
                    <div class="peek" id="reachVillagePeek"></div>
                </div>
                <div class="field wide">
                    <label for="coinInput" data-i18n="coinInputLabel">身上金幣</label>
                    <div class="coin-box">
                        <input id="coinInput" type="text" inputmode="numeric" autocomplete="off" disabled />
                    </div>
                    <div class="peek" id="coinPeek"></div>
                </div>
            </div>
            <div class="vault" aria-live="polite" id="reachVault"></div>
        </section>

        <!-- Range -->
        <section class="panel" role="tabpanel" id="panel-range" aria-labelledby="tab-range" hidden>
            <h2 data-i18n="rangeTitle">從第幾村建到看見第幾村，需要多少金幣？</h2>
            <div class="fields">
                <div class="field">
                    <label for="rangeStart" data-i18n="rangeStartLabel">從第幾村開始</label>
                    <div class="stepper" data-for="rangeStart"></div>
                    <div class="peek" id="rangeStartPeek"></div>
                </div>
                <div class="field">
                    <label for="rangeTarget" data-i18n="rangeTargetLabel">看見第幾村</label>
                    <div class="stepper" data-for="rangeTarget"></div>
                    <div class="peek" id="rangeTargetPeek"></div>
                </div>
            </div>
            <p class="hint" data-i18n="rangeHint"></p>
            <div class="vault" aria-live="polite" id="rangeVault"></div>
            <div class="compare" id="rangeCompare"></div>
        </section>

        <!-- Single -->
        <section class="panel" role="tabpanel" id="panel-single" aria-labelledby="tab-single" hidden>
            <h2 data-i18n="singleTitle">查詢單一村落的建造金額</h2>
            <div class="fields single">
                <div class="field">
                    <label for="singleVillage" data-i18n="inputLabel">輸入村落編號</label>
                    <div class="stepper" data-for="singleVillage"></div>
                    <div class="peek" id="singleVillagePeek"></div>
                </div>
            </div>
            <div class="vault" aria-live="polite" id="singleVault"></div>
            <div class="compare" id="singleCompare"></div>
        </section>

        <footer class="footer">
            <p data-i18n="notice">數據參考公開網頁與社群整理資料，僅供參考，實際遊戲內容請以官方或遊戲內顯示為準。</p>
            <p id="dataCount"></p>
            <p>© <span id="year"></span> 大佬群CSL</p>
        </footer>
    </main>

    <button type="button" class="fab" id="mapOpen" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z" />
            <path d="M9 4v14M15 6v14" />
        </svg>
        <span data-i18n="mapButton">村落地圖</span>
    </button>

    <div class="map" id="map" role="dialog" aria-modal="true" aria-labelledby="mapTitle" hidden>
        <div class="map-head">
            <div class="map-head-inner">
                <div class="map-top">
                    <h2 id="mapTitle" data-i18n="mapTitle">村落地圖</h2>
                    <button type="button" class="map-close" id="mapClose" data-i18n-aria="mapClose">×</button>
                </div>
                <label for="mapSearch" class="sr-only" data-i18n="mapSearchLabel">搜尋村落</label>
                <input id="mapSearch" class="map-search" type="search" autocomplete="off" enterkeyhint="search" />
                <div class="map-discounts" id="mapDiscounts"></div>
                <div class="map-note" id="mapNote"></div>
                <div class="map-suggest" id="mapSuggest"></div>
            </div>
        </div>
        <div class="map-scroll" id="mapScroll">
            <div class="map-path" id="mapPath"></div>
        </div>
    </div>

    <script>
        const DATA_FILE = "villages_cost.json";
        const I18N_FILE = "i18n.json";
        const NAMES_FILE = "village_names.json";
        const STATE_KEY = "coin999_state";
        const LANG_KEY = "coin999_lang";
        const DISCOUNTS = [0, 10, 20, 25, 30, 40];
        const TABS = ["reach", "range", "single"];

        let villages = [];
        let byNumber = new Map();
        let maxVillage = 0;
        let i18n = {};
        let villageNames = {};
        let ready = false;
        let statusKey = "loading";
        let statusParams = {};

        const store = {
            get(key, fallback) {
                try {
                    const v = localStorage.getItem(key);
                    return v === null ? fallback : v;
                } catch (e) {
                    return fallback;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch (e) { /* storage unavailable */ }
            }
        };

        const state = Object.assign(
            { tab: "reach", discount: 0, cur: "", target: "", coins: "", single: "" },
            (() => {
                try {
                    return JSON.parse(store.get(STATE_KEY, "{}")) || {};
                } catch (e) {
                    return {};
                }
            })()
        );
        if (!TABS.includes(state.tab)) state.tab = "reach";
        state.discount = Number(state.discount);
        if (!DISCOUNTS.includes(state.discount)) state.discount = 0;
        ["cur", "target", "coins", "single"].forEach(k => {
            state[k] = String(state[k] || "").replace(/\D/g, "");
        });

        // First visit: fill every tab with an example so results show right away
        const EXAMPLE = { cur: "10", coins: "1500000000", target: "15", single: "50" };
        if (!state.seeded) {
            Object.keys(EXAMPLE).forEach(k => {
                if (!state[k]) state[k] = EXAMPLE[k];
            });
            state.seeded = true;
        }

        let currentLang = store.get(LANG_KEY, "zh-Hant");

        const $ = id => document.getElementById(id);
        const languageSelect = $("languageSelect");
        const statusEl = $("status");
        const coinInput = $("coinInput");

        $("year").textContent = new Date().getFullYear();

        function saveState() {
            store.set(STATE_KEY, JSON.stringify(state));
        }

        /* ---------- i18n ---------- */
        function t(key, params = {}) {
            const pack = i18n[currentLang] || {};
            const base = i18n["zh-Hant"] || {};
            const value = pack[key] !== undefined ? pack[key] : base[key];
            if (value === undefined) return key;
            return String(value).replace(/\{(\w+)\}/g, (_, k) => (params[k] !== undefined ? params[k] : "{" + k + "}"));
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        /* ---------- Numbers ---------- */
        function digits(v) {
            return String(v || "").replace(/\D/g, "");
        }

        function toBig(v) {
            if (typeof v === "bigint") return v;
            return BigInt(Math.round(Number(v) || 0));
        }

        function formatNumber(n) {
            return toBig(n).toLocaleString(t("locale"));
        }

        function trimDecimal(value) {
            return Number(value.toFixed(3)).toString();
        }

        function formatCoins(num) {
            const n = Number(num);
            if (!Number.isFinite(n)) return "0" + t("unitPlain");

            if (currentLang === "zh-Hant" || currentLang === "vi") {
                if (n >= 1e12) return trimDecimal(n / 1e12) + t("unitTrillion");
                if (n >= 1e8) return trimDecimal(n / 1e8) + t("unitHundredMillion");
                if (n >= 1e4) return trimDecimal(n / 1e4) + t("unitTenThousand");
                return formatNumber(n) + t("unitPlain");
            }

            if (n >= 1e12) return trimDecimal(n / 1e12) + t("unitTrillion");
            if (n >= 1e9) return trimDecimal(n / 1e9) + t("unitBillion");
            if (n >= 1e6) return trimDecimal(n / 1e6) + t("unitMillion");
            return formatNumber(n) + t("unitPlain");
        }

        function costOf(village, discount) {
            const base = toBig(village.cost);
            return (base * BigInt(100 - discount) + 50n) / 100n;
        }

        function discountName(d) {
            return d === 0 ? t("noDiscountShort") : d + "% off";
        }

        // Localized village name; falls back to the English name from the data file
        function vname(v) {
            const pack = villageNames[currentLang];
            return (pack && pack[v.no]) || v.name;
        }

        function villageLabel(v) {
            return t("nextVillage", { number: v.no, name: vname(v) });
        }

        /* ---------- Village steppers ---------- */
        const stepperFields = {
            reachVillage: { stateKey: "cur", peek: "reachVillagePeek" },
            rangeStart: { stateKey: "cur", peek: "rangeStartPeek" },
            rangeTarget: { stateKey: "target", peek: "rangeTargetPeek" },
            singleVillage: { stateKey: "single", peek: "singleVillagePeek" }
        };

        document.querySelectorAll(".stepper").forEach(box => {
            const id = box.dataset.for;
            box.innerHTML = `
                <button type="button" data-step="-1" data-i18n-aria="stepDown" disabled>−</button>
                <input id="${id}" type="text" inputmode="numeric" autocomplete="off" maxlength="4" disabled />
                <button type="button" data-step="1" data-i18n-aria="stepUp" disabled>+</button>`;
            const input = box.querySelector("input");

            box.querySelectorAll("button").forEach(btn => {
                btn.addEventListener("click", () => stepVillage(id, Number(btn.dataset.step)));
            });

            input.addEventListener("input", () => {
                const clean = digits(input.value).slice(0, 4);
                if (input.value !== clean) input.value = clean;
                setVillageValue(id, clean);
            });

            input.addEventListener("keydown", e => {
                if (e.key === "ArrowUp") {
                    e.preventDefault();
                    stepVillage(id, 1);
                } else if (e.key === "ArrowDown") {
                    e.preventDefault();
                    stepVillage(id, -1);
                }
            });
        });

        function stepVillage(id, step) {
            if (!ready) return;
            const field = stepperFields[id];
            let n = Number(state[field.stateKey]);
            if (!n) {
                // an empty "see village" field starts from the start village
                n = id === "rangeTarget" && state.cur ? Number(state.cur) : 0;
            }
            n = Math.min(Math.max(n + step, 1), maxVillage);
            setVillageValue(id, String(n), true);
        }

        function setVillageValue(id, value, syncInput = false) {
            const field = stepperFields[id];
            state[field.stateKey] = value;

            // "目前所在村落" and "從第幾村開始" share the same value
            Object.keys(stepperFields).forEach(otherId => {
                if (stepperFields[otherId].stateKey === field.stateKey && (otherId !== id || syncInput)) {
                    $(otherId).value = value;
                }
            });

            saveState();
            renderAll();
        }

        function renderPeek(id) {
            const field = stepperFields[id];
            const peek = $(field.peek);
            const value = state[field.stateKey];
            peek.classList.remove("bad");

            if (!value) {
                peek.textContent = "1–" + maxVillage;
                return;
            }

            const v = byNumber.get(Number(value));
            if (v) {
                peek.textContent = vname(v);
            } else {
                peek.textContent = t("villageNotFoundShort");
                peek.classList.add("bad");
            }
        }

        /* ---------- Coin input with digit grouping ---------- */
        coinInput.addEventListener("input", () => {
            const caret = coinInput.selectionStart ?? coinInput.value.length;
            const digitsBeforeCaret = digits(coinInput.value.slice(0, caret)).length;
            const clean = digits(coinInput.value).replace(/^0+(?=\d)/, "").slice(0, 20);

            state.coins = clean;
            coinInput.value = clean ? formatNumber(BigInt(clean)) : "";

            // put the caret back after the same number of digits
            let pos = 0;
            let seen = 0;
            while (pos < coinInput.value.length && seen < digitsBeforeCaret) {
                if (/\d/.test(coinInput.value[pos])) seen++;
                pos++;
            }
            coinInput.setSelectionRange(pos, pos);

            saveState();
            renderAll();
        });

        /* ---------- Discount chips ---------- */
        function buildChips() {
            const wrap = $("discountChips");
            wrap.innerHTML = DISCOUNTS.map(d => `
                <label class="chip">
                    <input type="radio" name="discount" value="${d}" ${d === state.discount ? "checked" : ""} disabled />
                    <span data-discount="${d}">${escapeHtml(discountName(d))}</span>
                </label>`).join("");

            wrap.querySelectorAll("input").forEach(r => {
                r.addEventListener("change", () => setDiscount(Number(r.value)));
            });
        }

        function setDiscount(d) {
            state.discount = d;
            const radio = document.querySelector(`input[name="discount"][value="${d}"]`);
            if (radio) radio.checked = true;
            saveState();
            renderAll();
        }

        /* ---------- Tabs ---------- */
        const tabButtons = Array.from(document.querySelectorAll(".tab"));

        tabButtons.forEach((btn, i) => {
            btn.addEventListener("click", () => setTab(btn.dataset.tab));
            btn.addEventListener("keydown", e => {
                let next = null;
                if (e.key === "ArrowRight") next = (i + 1) % tabButtons.length;
                if (e.key === "ArrowLeft") next = (i - 1 + tabButtons.length) % tabButtons.length;
                if (next !== null) {
                    e.preventDefault();
                    setTab(tabButtons[next].dataset.tab);
                    tabButtons[next].focus();
                }
            });
        });

        function setTab(tab) {
            state.tab = tab;
            tabButtons.forEach(btn => {
                const on = btn.dataset.tab === tab;
                btn.setAttribute("aria-selected", on ? "true" : "false");
                btn.tabIndex = on ? 0 : -1;
            });
            TABS.forEach(name => {
                $("panel-" + name).hidden = name !== tab;
            });
            saveState();
        }

        /* ---------- Shared renderers ---------- */
        function emptyVault(text, bad = false) {
            return `<div class="vault-empty${bad ? " bad" : ""}">${escapeHtml(text)}</div>`;
        }

        function compareList(costFor) {
            const full = costFor(0);
            const rows = DISCOUNTS.map(d => {
                const amount = costFor(d);
                const selected = d === state.discount;
                return `
                    <li><button type="button" data-pick="${d}" aria-pressed="${selected}">
                        <span class="cmp-off">${escapeHtml(discountName(d))}</span>
                        <span class="cmp-amt">${escapeHtml(formatCoins(amount))}${selected ? `<span class="cmp-tag">${escapeHtml(t("selectedTag"))}</span>` : ""}</span>
                        <span class="cmp-save">${d === 0 ? "" : escapeHtml(t("savedTotal", { amount: formatCoins(full - amount) }))}</span>
                    </button></li>`;
            }).join("");
            return `<h3>${escapeHtml(t("compareLabel"))}</h3><ul>${rows}</ul>`;
        }

        function bindCompare(container) {
            container.querySelectorAll("[data-pick]").forEach(btn => {
                btn.addEventListener("click", () => setDiscount(Number(btn.dataset.pick)));
            });
        }

        function priceTags(full, paid) {
            if (state.discount === 0) return "";
            return `<div class="vault-tags">
                <span class="strike">${escapeHtml(t("originalTotal", { amount: formatCoins(full) }))}</span>
                <span class="saved">${escapeHtml(t("savedTotal", { amount: formatCoins(full - paid) }))}</span>
            </div>`;
        }

        /* ---------- Reachable ---------- */
        function renderReach() {
            const vault = $("reachVault");

            if (!state.cur || !state.coins) {
                const key = !state.cur && !state.coins ? "enterCurrentVillageAndCoins" : !state.cur ? "enterCurrentVillage" : "enterCoins";
                vault.innerHTML = emptyVault(t(key));
                return;
            }

            const start = Number(state.cur);
            const startIndex = villages.findIndex(v => v.no === start);
            if (startIndex === -1) {
                vault.innerHTML = emptyVault(t("villageOutOfRange", { max: maxVillage }), true);
                return;
            }

            const owned = BigInt(state.coins);
            const d = state.discount;
            let spent = 0n;
            let done = 0;
            let next = villages[startIndex];

            for (let i = startIndex; i < villages.length; i++) {
                const cost = costOf(villages[i], d);
                if (spent + cost > owned) {
                    next = villages[i];
                    break;
                }
                spent += cost;
                done++;
                next = villages[i + 1] || null;
            }

            const remaining = owned - spent;
            let label;
            let main;
            let detail;

            if (done === 0) {
                const cost = costOf(villages[startIndex], d);
                label = t("shortCoinsLabel");
                main = `<div class="vault-big">${escapeHtml(formatCoins(cost - owned))}</div>`;
                detail = `<div class="vault-line">${escapeHtml(t("currentVillageCost", { cost: formatCoins(cost) }))}</div>`;
            } else {
                const reached = byNumber.get(start + done);
                label = t("reachableLabel");
                main = `<div class="vault-big text">${escapeHtml(reached ? villageLabel(reached) : t("noNextVillage"))}</div>`;
                detail = `<div class="vault-line">${escapeHtml(t("buildCountFromCurrent", { start, count: done }))}</div>`;
            }

            // `next` is the village still being built (null when everything is built).
            // Finishing it reveals the village after it, which is what "下一村" shows.
            const building = next;
            next = building ? byNumber.get(building.no + 1) || null : null;
            const shortage = building ? costOf(building, d) - remaining : 0n;

            vault.innerHTML = `
                <div class="vault-label">${escapeHtml(label)}</div>
                ${main}
                ${detail}
                <div class="stats">
                    <div class="stat"><div class="stat-label">${escapeHtml(t("usedCoinsLabel"))}</div><div class="stat-value">${escapeHtml(formatCoins(spent))}</div></div>
                    <div class="stat"><div class="stat-label">${escapeHtml(t("remainingCoinsLabel"))}</div><div class="stat-value">${escapeHtml(formatCoins(remaining))}</div></div>
                    <div class="stat"><div class="stat-label">${escapeHtml(t("nextVillageLabel"))}</div><div class="stat-value">${escapeHtml(next ? villageLabel(next) : t("noNextVillage"))}</div></div>
                    <div class="stat"><div class="stat-label">${escapeHtml(t("shortCoinsLabel"))}</div><div class="stat-value short">${escapeHtml(building ? formatCoins(shortage > 0n ? shortage : 0n) : t("noShortage"))}</div></div>
                </div>`;
        }

        /* ---------- Range ---------- */
        function renderRange() {
            const vault = $("rangeVault");
            const compare = $("rangeCompare");
            compare.innerHTML = "";

            if (!state.cur || !state.target) {
                vault.innerHTML = emptyVault(t("enterRangeVillages"));
                return;
            }

            const start = Number(state.cur);
            const target = Number(state.target);

            if (!byNumber.has(start) || !byNumber.has(target)) {
                vault.innerHTML = emptyVault(t("villageOutOfRange", { max: maxVillage }), true);
                return;
            }

            if (target <= start) {
                vault.innerHTML = emptyVault(t("rangeTargetTooLow"), true);
                return;
            }

            // Seeing village B means finishing villages start .. B-1
            const toBuild = villages.filter(v => v.no >= start && v.no < target);
            const sum = d => toBuild.reduce((acc, v) => acc + costOf(v, d), 0n);
            const paid = sum(state.discount);
            const full = sum(0);

            vault.innerHTML = `
                <div class="vault-label">${escapeHtml(t("rangeTotalLabel"))}</div>
                <div class="vault-big">${escapeHtml(formatCoins(paid))}</div>
                <div class="vault-line">${escapeHtml(t("rangeSummary", { start, target }))}</div>
                <div class="vault-line">${escapeHtml(t("rangeBuildCount", { count: toBuild.length, from: start, to: target - 1 }))}</div>
                ${priceTags(full, paid)}
                <div class="vault-raw">${escapeHtml(formatNumber(paid))}</div>`;

            compare.innerHTML = compareList(sum);
            bindCompare(compare);
        }

        /* ---------- Single ---------- */
        function renderSingle() {
            const vault = $("singleVault");
            const compare = $("singleCompare");
            compare.innerHTML = "";

            if (!state.single) {
                vault.innerHTML = emptyVault(t("enterVillageNumber"));
                return;
            }

            const v = byNumber.get(Number(state.single));
            if (!v) {
                vault.innerHTML = emptyVault(t("villageOutOfRange", { max: maxVillage }), true);
                return;
            }

            const paid = costOf(v, state.discount);
            const full = costOf(v, 0);

            vault.innerHTML = `
                <div class="vault-label">${escapeHtml(villageLabel(v))}</div>
                <div class="vault-big">${escapeHtml(formatCoins(paid))}</div>
                ${priceTags(full, paid)}
                <div class="vault-raw">${escapeHtml(formatNumber(paid))}</div>`;

            compare.innerHTML = compareList(d => costOf(v, d));
            bindCompare(compare);
        }

        /* ---------- Status ---------- */
        function setStatus(key, params = {}, plainText = null) {
            statusKey = key;
            statusParams = params;
            if (!key && !plainText) {
                statusEl.hidden = true;
                return;
            }
            statusEl.hidden = false;
            statusEl.textContent = plainText || t(key, params);
            statusEl.className = "status" + (key === "loadFailed" || plainText ? " error" : "");
        }

        /* ---------- Render all ---------- */
        function applyI18n() {
            const pack = i18n[currentLang] || {};
            document.documentElement.lang = pack.htmlLang || currentLang;
            document.title = t("pageTitle");

            document.querySelectorAll("[data-i18n]").forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll("[data-i18n-aria]").forEach(el => {
                el.setAttribute("aria-label", t(el.dataset.i18nAria));
            });
            document.querySelectorAll("[data-discount]").forEach(el => {
                el.textContent = discountName(Number(el.dataset.discount));
            });

            const placeholder = ready ? "" : statusKey === "loadFailed" ? t("inputPlaceholderFailed") : t("inputPlaceholderLoading");
            Object.keys(stepperFields).forEach(id => {
                $(id).placeholder = placeholder;
            });
            coinInput.placeholder = ready ? "0" : placeholder;
            if (state.coins) coinInput.value = formatNumber(BigInt(state.coins));

            $("dataCount").textContent = ready ? t("dataCount", { count: villages.length }) : "";
            languageSelect.value = currentLang;

            if (statusKey) setStatus(statusKey, statusParams);
            renderAll();
        }

        function renderAll() {
            if (!ready) return;
            Object.keys(stepperFields).forEach(renderPeek);
            $("coinPeek").textContent = state.coins ? t("coinPreview", { amount: formatCoins(BigInt(state.coins)) }) : "";
            renderReach();
            renderRange();
            renderSingle();
        }

        function setEnabled(on) {
            document.querySelectorAll(".panel input, .panel button, input[name='discount'], #mapOpen").forEach(el => {
                el.disabled = !on;
            });
        }

        /* ---------- Village map ---------- */
        const mapEl = $("map");
        const mapSearch = $("mapSearch");
        const mapPath = $("mapPath");
        const mapNote = $("mapNote");
        const mapSuggest = $("mapSuggest");
        const mapOpenBtn = $("mapOpen");
        const mapDiscounts = $("mapDiscounts");
        const MAP_X = [30, 70];
        let mapFocus = null;
        let swapTimer = null;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

        function renderMap() {
            // Highest village on top, like the in-game map
            const ordered = villages.slice().reverse();
            const current = Number(state.cur);
            const discount = state.discount;

            mapPath.innerHTML = ordered.map((v, i) => {
                const x = MAP_X[v.no % 2];
                const above = ordered[i - 1];
                const below = ordered[i + 1];
                // Each row draws only its own half of the S-curves to its neighbours,
                // so rows can be skipped off screen (content-visibility) without clipping the path.
                let d = "";
                if (above) {
                    const a = MAP_X[above.no % 2];
                    d += `M${(a + x) / 2} 0 C${(a + 3 * x) / 4} 30.6, ${x} 36.3, ${x} 50 `;
                }
                if (below) {
                    const b = MAP_X[below.no % 2];
                    d += `M${x} 50 C${x} 63.8, ${(3 * x + b) / 4} 69.4, ${(x + b) / 2} 100`;
                }
                const link = d
                    ? `<svg class="map-link" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                           <path vector-effect="non-scaling-stroke" d="${d}" />
                       </svg>`
                    : "";
                const sale = costOf(v, discount);
                const orig = discount === 0
                    ? ""
                    : `<span class="node-orig">${escapeHtml(t("originalTotal", { amount: formatCoins(costOf(v, 0)) }))}</span>`;
                return `
                    <div class="map-row${v.no === current ? " current" : ""}" id="mv-${v.no}">
                        ${link}
                        <div class="map-node" style="--x:${x}%">
                            <div class="diamond"><span>${v.no}</span></div>
                            <div class="node-name">${v.no}. ${escapeHtml(vname(v))}</div>
                            <span class="node-price">${escapeHtml(formatCoins(sale))}</span>
                            ${orig}
                            ${v.no === current ? `<span class="node-tag">${escapeHtml(t("mapCurrentTag"))}</span>` : ""}
                        </div>
                    </div>`;
            }).join("");
        }

        function renderMapDiscounts() {
            mapDiscounts.innerHTML = DISCOUNTS.map(d =>
                `<button type="button" data-d="${d}" aria-pressed="${d === state.discount}">${escapeHtml(discountName(d))}</button>`
            ).join("");
            mapDiscounts.querySelectorAll("button").forEach(btn => {
                btn.addEventListener("click", () => {
                    setDiscount(Number(btn.dataset.d));
                    refreshMap();
                });
            });
        }

        function refreshMap() {
            const hadHit = Boolean(mapPath.querySelector(".map-row.hit"));
            // prices of the new discount fade in; class is removed once the animation is done
            mapPath.classList.add("is-swapping");
            clearTimeout(swapTimer);
            swapTimer = setTimeout(() => mapPath.classList.remove("is-swapping"), 350);
            renderMap();
            renderMapDiscounts();
            mapPriceNote();
            if (mapFocus !== null) jumpToVillage(mapFocus, hadHit);
        }

        function mapPriceNote() {
            mapNote.classList.remove("bad");
            mapNote.textContent = t("mapPriceNote", { discount: discountName(state.discount) });
        }

        function jumpToVillage(no, highlight = true, smooth = false) {
            const row = $("mv-" + no);
            if (!row) return;
            mapFocus = no;
            mapPath.querySelectorAll(".map-row.hit").forEach(el => el.classList.remove("hit"));
            if (highlight) {
                void row.offsetWidth; // restart the pop animation when the same village is hit again
                row.classList.add("hit");
            }
            // Glide only for short hops (arrow keys); long jumps stay instant so they never feel slow
            row.scrollIntoView({ block: "center", behavior: smooth && !reduceMotion.matches ? "smooth" : "auto" });
        }

        function stepMap(step) {
            const index = villages.findIndex(v => v.no === mapFocus);
            const nextIndex = Math.min(Math.max((index === -1 ? 0 : index) + step, 0), villages.length - 1);
            const next = villages[nextIndex];
            mapSearch.value = String(next.no);
            mapSuggest.innerHTML = "";
            mapPriceNote();
            jumpToVillage(next.no, true, true);
        }

        function findVillages(query) {
            const q = query.trim().toLowerCase();
            if (!q) return [];
            if (/^\d+$/.test(q)) {
                const v = byNumber.get(Number(q));
                return v ? [v] : [];
            }
            return villages.filter(v => vname(v).toLowerCase().includes(q) || v.name.toLowerCase().includes(q));
        }

        function handleMapSearch(commit) {
            const matches = findVillages(mapSearch.value);
            mapSuggest.innerHTML = "";

            if (!mapSearch.value.trim()) {
                mapPriceNote();
                return;
            }

            if (matches.length === 0) {
                mapNote.textContent = t("mapNoMatch");
                mapNote.classList.add("bad");
                return;
            }

            mapPriceNote();

            if (matches.length === 1 || commit || /^\d+$/.test(mapSearch.value.trim())) {
                jumpToVillage(matches[0].no);
            }

            if (matches.length > 1) {
                mapSuggest.innerHTML = matches.slice(0, 8).map(v =>
                    `<button type="button" data-no="${v.no}">${v.no}. ${escapeHtml(vname(v))}</button>`
                ).join("");
                mapSuggest.querySelectorAll("button").forEach(btn => {
                    btn.addEventListener("click", () => jumpToVillage(Number(btn.dataset.no)));
                });
            }
        }

        function openMap() {
            if (!ready) return;
            renderMap();
            renderMapDiscounts();
            mapPriceNote();
            mapSuggest.innerHTML = "";
            mapSearch.value = "";
            mapSearch.placeholder = t("mapSearchPlaceholder");
            mapEl.hidden = false;
            document.body.classList.add("map-open");
            jumpToVillage(byNumber.has(Number(state.cur)) ? Number(state.cur) : villages[0].no, false);
            mapSearch.focus({ preventScroll: true });
        }

        function closeMap() {
            if (mapEl.hidden || mapEl.classList.contains("is-closing")) return;
            let done = false;
            const finish = () => {
                if (done) return;
                done = true;
                mapEl.removeEventListener("animationend", onEnd);
                mapEl.classList.remove("is-closing");
                mapEl.hidden = true;
                document.body.classList.remove("map-open");
                mapOpenBtn.focus();
            };
            // child animations (diamond pop, price fade) bubble up, so only react to the map's own exit
            const onEnd = e => {
                if (e.target === mapEl) finish();
            };
            if (reduceMotion.matches) {
                finish();
                return;
            }
            mapEl.classList.add("is-closing");
            mapEl.addEventListener("animationend", onEnd);
            setTimeout(finish, 300); // fallback when animations don't run (background tab, power saving)
        }

        let searchTimer = null;
        mapOpenBtn.addEventListener("click", openMap);
        $("mapClose").addEventListener("click", closeMap);
        mapSearch.addEventListener("input", () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => handleMapSearch(false), 250);
        });
        mapSearch.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                e.preventDefault();
                clearTimeout(searchTimer);
                handleMapSearch(true);
            }
        });
        document.addEventListener("keydown", e => {
            if (mapEl.hidden) return;
            if (e.key === "Escape") {
                closeMap();
            } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
                // ArrowUp = next village (higher on the map), ArrowDown = previous village
                e.preventDefault();
                clearTimeout(searchTimer);
                stepMap(e.key === "ArrowUp" ? 1 : -1);
            }
        });

        languageSelect.addEventListener("change", () => {
            currentLang = languageSelect.value;
            store.set(LANG_KEY, currentLang);
            applyI18n();
        });

        /* ---------- Loading ---------- */
        async function loadJson(file) {
            const res = await fetch(file, { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
        }

        async function init() {
            buildChips();
            setTab(state.tab);

            try {
                const data = await loadJson(I18N_FILE);
                if (!data || typeof data !== "object" || !data["zh-Hant"]) throw new Error("Missing zh-Hant language pack");
                i18n = data;
            } catch (error) {
                setStatus(null, {}, "讀取 i18n.json 失敗，請確認檔案名稱、位置與 JSON 格式是否正確。錯誤訊息：" + error.message);
                console.error("i18n load failed:", error);
                return;
            }

            if (!i18n[currentLang]) currentLang = "zh-Hant";
            languageSelect.disabled = false;
            setStatus("loading");
            applyI18n();

            try {
                // Optional: without it, villages keep their English names
                villageNames = await loadJson(NAMES_FILE);
            } catch (error) {
                villageNames = {};
                console.warn("village_names.json not loaded:", error);
            }

            try {
                const data = await loadJson(DATA_FILE);
                if (!Array.isArray(data)) throw new Error(t("jsonArrayError"));

                villages = data
                    .map(item => ({
                        no: Number(item["編號"] ?? item["Village Level"]),
                        name: String(item["名稱"] ?? item["Village Name"] ?? ""),
                        cost: Number(item["總金幣"] ?? item["總金幣數值"])
                    }))
                    .filter(v => Number.isInteger(v.no) && v.name !== "" && Number.isFinite(v.cost))
                    .sort((a, b) => a.no - b.no);

                if (villages.length === 0) throw new Error(t("jsonEmptyError"));

                byNumber = new Map(villages.map(v => [v.no, v]));
                maxVillage = villages[villages.length - 1].no;
            } catch (error) {
                setStatus("loadFailed", { error: error.message });
                applyI18n();
                return;
            }

            ready = true;
            setStatus(null);
            setEnabled(true);

            Object.keys(stepperFields).forEach(id => {
                $(id).value = state[stepperFields[id].stateKey] || "";
            });

            applyI18n();
        }

        init();
    </script>
</body>

</html>
