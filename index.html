<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>村落建造金額計算器</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />

    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --primary: #2563eb;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --success-bg: #ecfdf5;
            --success-text: #047857;
            --danger-bg: #fef2f2;
            --danger-text: #b91c1c;
            --warning-bg: #fffbeb;
            --warning-text: #92400e;
            --info-bg: #eff6ff;
            --info-text: #1d4ed8;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                "Microsoft JhengHei", Arial, sans-serif;
            background: linear-gradient(180deg, #eef5ff 0%, var(--bg) 45%, #ffffff 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 18px;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        .app {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        .language-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .language-bar label {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
            font-weight: 800;
            line-height: 1.2;
        }

        .language-select,
        .discount-select {
            width: 100%;
            min-height: 52px;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 11px 38px 11px 14px;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.25;
            color: #111827;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .language-select {
            width: auto;
            min-width: 205px;
            min-height: 46px;
            padding: 9px 38px 9px 14px;
            font-size: 15px;
            border-radius: 13px;
        }

        .language-select:focus,
        .discount-select:focus,
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .header {
            text-align: center;
            padding: 20px 8px 14px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.25;
            color: #111827;
            letter-spacing: -0.5px;
            font-weight: 950;
        }

        .header p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.65;
        }

        .header .notice {
            margin: 6px auto 0;
            max-width: 620px;
            color: #8a94a6;
            font-size: 12px;
            line-height: 1.6;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(229, 231, 235, 0.85);
            padding: 22px;
            margin-top: 16px;
        }

        .calculator-title {
            font-size: 22px;
            font-weight: 950;
            margin: 0 0 18px;
            color: #111827;
            line-height: 1.35;
            letter-spacing: -0.2px;
        }

        label {
            display: block;
            font-weight: 850;
            margin-bottom: 10px;
            font-size: 17px;
            line-height: 1.35;
            color: #111827;
        }

        input {
            width: 100%;
            min-width: 0;
            min-height: 64px;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px 14px;
            font-size: 22px;
            font-weight: 850;
            line-height: 1.25;
            text-align: center;
            letter-spacing: 0;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
            background: #ffffff;
            color: #111827;
        }

        input::placeholder {
            color: #7b8494;
            opacity: 1;
            font-size: 22px;
            font-weight: 850;
            letter-spacing: 0;
        }

        input:disabled,
        select:disabled {
            background: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
        }

        input:disabled::placeholder {
            color: #9ca3af;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .form-row.three {
            grid-template-columns: 1fr;
        }

        .form-row>div {
            min-width: 0;
        }

        .hint {
            margin-top: 12px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }

        .message,
        .calc-message {
            display: none;
            margin-top: 14px;
            border-radius: 14px;
            padding: 13px 14px;
            font-weight: 800;
            font-size: 15px;
            line-height: 1.5;
            text-align: center;
        }

        .message.error,
        .calc-message.error {
            display: block;
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .message.ok {
            display: block;
            background: var(--success-bg);
            color: var(--success-text);
        }

        .message.warning,
        .calc-message.warning {
            display: block;
            background: var(--warning-bg);
            color: var(--warning-text);
        }

        .message.info {
            display: block;
            background: var(--info-bg);
            color: var(--info-text);
        }

        .calc-message.show {
            display: block;
        }

        .result {
            display: none;
            margin-top: 16px;
        }

        .result.show {
            display: block;
        }

        .village-info {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: #ffffff;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 14px;
        }

        .village-info .no {
            opacity: 0.86;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .village-info .name {
            font-size: 25px;
            font-weight: 900;
            line-height: 1.25;
            margin-bottom: 10px;
        }

        .village-info .cost-label {
            opacity: 0.86;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .village-info .cost {
            font-size: 30px;
            font-weight: 950;
            line-height: 1.15;
            word-break: break-word;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .discount-card {
            border: 1px solid var(--border);
            background: #ffffff;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }

        .discount-card .discount {
            font-size: 17px;
            font-weight: 900;
            color: var(--primary);
            white-space: nowrap;
        }

        .discount-card .amount {
            text-align: right;
            font-size: 18px;
            font-weight: 900;
            color: #111827;
            line-height: 1.35;
            word-break: break-word;
        }

        .amount-small {
            font-size: 12px;
            color: #6b7280;
            font-weight: 700;
        }

        .save-small {
            display: inline-block;
            margin-top: 4px;
            font-size: 12px;
            color: #047857;
            font-weight: 800;
        }

        .raw {
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .reachable-result {
            display: none;
            margin-top: 16px;
            border-radius: 18px;
            padding: 18px;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff;
        }

        .reachable-result.show {
            display: block;
        }

        .reachable-result .label {
            opacity: 0.9;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .reachable-result .main {
            font-size: 27px;
            line-height: 1.25;
            font-weight: 950;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .reachable-result .detail {
            font-size: 14px;
            line-height: 1.7;
            font-weight: 700;
            opacity: 0.95;
        }

        .reachable-extra {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .mini-stat {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            padding: 12px;
        }

        .mini-stat .mini-label {
            font-size: 12px;
            opacity: 0.86;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .mini-stat .mini-value {
            font-size: 17px;
            font-weight: 950;
            line-height: 1.35;
            word-break: break-word;
        }

        .section-divider {
            height: 1px;
            background: var(--border);
            margin: 18px 0;
        }

        .footer {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            padding: 18px 6px 6px;
            line-height: 1.6;
        }

        @media (min-width: 760px) {
            .form-row.three {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 180px;
                align-items: end;
                gap: 16px;
            }
        }

        @media (min-width: 560px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .discount-card:last-child {
                grid-column: span 2;
            }

            .reachable-extra {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 560px) and (max-width: 759px) {
            .form-row.three {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                align-items: end;
                gap: 14px;
            }

            .form-row.three>div:last-child {
                grid-column: span 2;
            }
        }

        @media (max-width: 430px) {
            body {
                padding: 12px;
            }

            .language-bar {
                justify-content: center;
            }

            .language-select {
                width: 100%;
                min-width: 0;
            }

            .header {
                padding: 16px 6px 12px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header p {
                font-size: 14px;
                line-height: 1.6;
            }

            .header .notice {
                font-size: 11px;
            }

            .card {
                padding: 14px;
                border-radius: 16px;
            }

            .calculator-title {
                font-size: 19px;
                margin-bottom: 14px;
                line-height: 1.35;
            }

            .form-row.three {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 86px;
                align-items: end;
                gap: 8px;
            }

            label {
                font-size: 12px;
                font-weight: 850;
                margin-bottom: 6px;
                line-height: 1.25;
                white-space: nowrap;
            }

            input {
                min-height: 46px;
                padding: 10px 6px;
                font-size: 16px;
                font-weight: 850;
                border-radius: 13px;
                text-align: center;
            }

            input::placeholder {
                font-size: 15px;
                font-weight: 850;
            }

            .discount-select {
                min-height: 46px;
                padding: 9px 26px 9px 8px;
                font-size: 14px;
                font-weight: 850;
                border-radius: 13px;
            }

            .hint {
                font-size: 12px;
                line-height: 1.5;
                margin-top: 10px;
            }

            .message,
            .calc-message {
                font-size: 14px;
                padding: 12px;
            }

            .village-info {
                padding: 16px;
            }

            .village-info .name {
                font-size: 22px;
            }

            .village-info .cost {
                font-size: 26px;
            }

            .discount-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .discount-card .amount {
                text-align: left;
                font-size: 20px;
            }

            .reachable-result {
                padding: 16px;
            }

            .reachable-result .main {
                font-size: 24px;
            }

            .mini-stat .mini-value {
                font-size: 16px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 10px;
            }

            .card {
                padding: 12px;
            }

            .header h1 {
                font-size: 22px;
            }

            .calculator-title {
                font-size: 18px;
            }

            .form-row.three {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 78px;
                gap: 6px;
            }

            label {
                font-size: 11px;
            }

            input {
                min-height: 44px;
                padding: 9px 5px;
                font-size: 15px;
            }

            input::placeholder {
                font-size: 14px;
            }

            .discount-select {
                min-height: 44px;
                padding: 8px 22px 8px 7px;
                font-size: 13px;
            }

            .language-select {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="language-bar">
            <label for="languageSelect" data-i18n="languageLabel">語言</label>
            <select id="languageSelect" class="language-select" disabled>
                <option value="zh-Hant">中文</option>
                <option value="en">English</option>
                <option value="vi">Tiếng Việt</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="th">ไทย</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="es">Español</option>
                <option value="pt">Português</option>
            </select>
        </div>

        <section class="header">
            <h1 data-i18n="title">村落建造金額計算器</h1>
            <p data-i18n="subtitle">輸入目前村落與身上金幣，計算可以從現在蓋到哪一村；也可查詢單一村落建造金額。</p>
            <p class="notice" data-i18n="notice">數據參考公開網頁與社群整理資料，僅供參考，實際遊戲內容請以官方或遊戲內顯示為準。</p>
        </section>

        <section class="card">
            <h2 class="calculator-title" data-i18n="reachableTitle">我目前的金幣可以從現在蓋到哪一村？</h2>

            <div class="form-row three">
                <div>
                    <label for="currentVillageInput" data-i18n="currentVillageInputLabel">目前所在村落</label>
                    <input id="currentVillageInput" type="tel" inputmode="numeric" pattern="[0-9]*"
                        placeholder="資料載入中..." autocomplete="off" disabled />
                </div>

                <div>
                    <label for="coinInput" data-i18n="coinInputLabel">輸入身上金幣</label>
                    <input id="coinInput" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="資料載入中..."
                        autocomplete="off" disabled />
                </div>

                <div>
                    <label for="discountSelect" data-i18n="discountSelectLabel">選擇折扣</label>
                    <select id="discountSelect" class="discount-select" disabled>
                        <option value="0" data-i18n="discountNone">無折扣</option>
                        <option value="10">10% off</option>
                        <option value="20">20% off</option>
                        <option value="25">25% off</option>
                        <option value="30">30% off</option>
                        <option value="40">40% off</option>
                    </select>
                </div>
            </div>

            <div class="hint" data-i18n="coinHint">請輸入你目前所在村落與身上金幣，系統會從目前村落開始累計計算。</div>

            <div id="calcMessage" class="calc-message warning"></div>

            <div id="reachableResult" class="reachable-result">
                <div class="label" data-i18n="reachableLabel">最多可到達</div>
                <div id="reachableMain" class="main"></div>

                <div class="detail" id="reachableDetail"></div>

                <div class="reachable-extra">
                    <div class="mini-stat">
                        <div class="mini-label" data-i18n="usedCoinsLabel">已使用金幣</div>
                        <div id="usedCoins" class="mini-value"></div>
                    </div>

                    <div class="mini-stat">
                        <div class="mini-label" data-i18n="remainingCoinsLabel">剩餘金幣</div>
                        <div id="remainingCoins" class="mini-value"></div>
                    </div>
                </div>

                <div class="reachable-extra">
                    <div class="mini-stat">
                        <div class="mini-label" data-i18n="nextVillageLabel">下一村</div>
                        <div id="nextVillageInfo" class="mini-value"></div>
                    </div>

                    <div class="mini-stat">
                        <div class="mini-label" data-i18n="shortCoinsLabel">還差金幣</div>
                        <div id="shortCoins" class="mini-value"></div>
                    </div>
                </div>
            </div>

            <div class="section-divider"></div>

            <label for="villageInput" data-i18n="inputLabel">輸入村落編號</label>
            <input id="villageInput" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="資料載入中..."
                autocomplete="off" disabled />

            <div id="message" class="message warning">正在讀取 i18n.json...</div>

            <div id="result" class="result">
                <div class="village-info">
                    <div id="villageNo" class="no"></div>
                    <div id="villageName" class="name"></div>
                    <div class="cost-label" data-i18n="originalCostLabel">蓋完整座村落原價需要</div>
                    <div id="villageCost" class="cost"></div>
                </div>

                <div class="grid" id="discountGrid"></div>
                <div id="rawCost" class="raw"></div>
            </div>
        </section>

        <div class="footer">
            © <span id="year"></span> Coin999-長長久久隊伍. All rights reserved.
        </div>
    </main>

    <script>
        let villages = [];
        let i18n = {};
        let maxVillageNumber = 1;
        let currentLang = localStorage.getItem("coin999_lang") || "zh-Hant";
        let currentMessageKey = null;
        let currentMessageType = "";
        let currentMessageParams = {};
        let lastRenderedVillage = null;
        let isI18nReady = false;

        const DATA_FILE = "villages_cost.json";
        const I18N_FILE = "i18n.json";

        const villageInput = document.getElementById("villageInput");
        const currentVillageInput = document.getElementById("currentVillageInput");
        const coinInput = document.getElementById("coinInput");
        const discountSelect = document.getElementById("discountSelect");

        const message = document.getElementById("message");
        const calcMessage = document.getElementById("calcMessage");

        const result = document.getElementById("result");
        const villageNo = document.getElementById("villageNo");
        const villageName = document.getElementById("villageName");
        const villageCost = document.getElementById("villageCost");
        const rawCost = document.getElementById("rawCost");
        const discountGrid = document.getElementById("discountGrid");
        const languageSelect = document.getElementById("languageSelect");

        const reachableResult = document.getElementById("reachableResult");
        const reachableMain = document.getElementById("reachableMain");
        const reachableDetail = document.getElementById("reachableDetail");
        const usedCoins = document.getElementById("usedCoins");
        const remainingCoins = document.getElementById("remainingCoins");
        const nextVillageInfo = document.getElementById("nextVillageInfo");
        const shortCoins = document.getElementById("shortCoins");

        const discounts = [10, 20, 25, 30, 40];

        document.getElementById("year").textContent = new Date().getFullYear();

        function interpolate(template, params = {}) {
            return String(template).replace(/\{(\w+)\}/g, function (_, key) {
                return params[key] !== undefined ? params[key] : "{" + key + "}";
            });
        }

        function t(key, params = {}) {
            const langPack = i18n[currentLang] || i18n["zh-Hant"] || {};
            const zhPack = i18n["zh-Hant"] || {};
            const value = langPack[key] !== undefined ? langPack[key] : zhPack[key];

            if (value === undefined) return key;

            return interpolate(value, params);
        }

        function setInitialLoadingState() {
            languageSelect.disabled = true;
            villageInput.disabled = true;
            currentVillageInput.disabled = true;
            coinInput.disabled = true;
            discountSelect.disabled = true;

            message.textContent = "正在讀取 i18n.json...";
            message.className = "message warning";
        }

        function applyI18n() {
            if (!isI18nReady) return;

            const langPack = i18n[currentLang] || i18n["zh-Hant"] || {};

            document.documentElement.lang = langPack.htmlLang || currentLang;
            document.title = t("pageTitle");

            document.querySelectorAll("[data-i18n]").forEach(element => {
                const key = element.getAttribute("data-i18n");
                element.textContent = t(key);
            });

            if (villageInput.disabled) {
                villageInput.placeholder = currentMessageType === "error"
                    ? t("inputPlaceholderFailed")
                    : t("inputPlaceholderLoading");
            } else {
                villageInput.placeholder = t("inputPlaceholderReady");
            }

            if (currentVillageInput.disabled) {
                currentVillageInput.placeholder = currentMessageType === "error"
                    ? t("currentVillagePlaceholderFailed")
                    : t("currentVillagePlaceholderLoading");
            } else {
                currentVillageInput.placeholder = t("currentVillagePlaceholderReady");
            }

            if (coinInput.disabled) {
                coinInput.placeholder = currentMessageType === "error"
                    ? t("coinInputPlaceholderFailed")
                    : t("coinInputPlaceholderLoading");
            } else {
                coinInput.placeholder = t("coinInputPlaceholderReady");
            }

            refreshCurrentMessage();

            if (lastRenderedVillage) {
                renderVillage(lastRenderedVillage);
            }

            calculateReachableVillage();

            languageSelect.value = currentLang;
        }

        function refreshCurrentMessage() {
            if (!currentMessageKey) return;

            showMessage(
                t(currentMessageKey, currentMessageParams),
                currentMessageType,
                currentMessageKey,
                currentMessageParams
            );
        }

        async function loadI18n() {
            try {
                showPlainMessage("正在讀取 i18n.json...", "warning");

                const response = await fetch(I18N_FILE, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const data = await response.json();

                if (!data || typeof data !== "object" || Array.isArray(data)) {
                    throw new Error("Invalid i18n JSON");
                }

                if (!data["zh-Hant"]) {
                    throw new Error("Missing zh-Hant language pack");
                }

                i18n = data;
                isI18nReady = true;

                if (!i18n[currentLang]) {
                    currentLang = "zh-Hant";
                    localStorage.setItem("coin999_lang", currentLang);
                }

                languageSelect.disabled = false;
                applyI18n();
            } catch (error) {
                isI18nReady = false;
                i18n = {};
                disableUI();

                showPlainMessage(
                    "讀取 i18n.json 失敗，請確認檔案名稱、位置與 JSON 格式是否正確。錯誤訊息：" + error.message,
                    "error"
                );

                console.error("i18n load failed:", error);
            }
        }

        async function loadVillages() {
            try {
                showMessage(t("loading"), "warning", "loading");

                const response = await fetch(DATA_FILE, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error(t("jsonArrayError"));
                }

                // 同時相容新版英文欄位 (Village Level, Village Name, 總金幣數值) 與舊版欄位
                villages = data
                    .map(item => {
                        const no = item["編號"] ?? item["Village Level"];
                        const name = item["名稱"] ?? item["Village Name"] ?? "";
                        const coins = item["總金幣"] ?? item["總金幣數值"];

                        return {
                            ...item,
                            "編號": Number(no),
                            "名稱": String(name),
                            "總金幣": Number(coins)
                        };
                    })
                    .filter(item => {
                        return (
                            Number.isFinite(item["編號"]) &&
                            item["名稱"] !== "" &&
                            Number.isFinite(item["總金幣"])
                        );
                    })
                    .sort((a, b) => itemNumber(a) - itemNumber(b));

                function itemNumber(v) {
                    return Number(v["編號"]);
                }

                if (villages.length === 0) {
                    throw new Error(t("jsonEmptyError"));
                }

                maxVillageNumber = Math.max(...villages.map(v => Number(v["編號"])));

                enableUI();
                showMessage(t("loaded", { count: villages.length }), "ok", "loaded", {
                    count: villages.length
                });
            } catch (error) {
                disableUI();
                showMessage(t("loadFailed", { error: error.message }), "error", null);
            }
        }

        function enableUI() {
            languageSelect.disabled = false;

            villageInput.disabled = false;
            villageInput.placeholder = t("inputPlaceholderReady");

            currentVillageInput.disabled = false;
            currentVillageInput.placeholder = t("currentVillagePlaceholderReady");

            coinInput.disabled = false;
            coinInput.placeholder = t("coinInputPlaceholderReady");

            discountSelect.disabled = false;

            currentVillageInput.focus();
        }

        function disableUI() {
            villageInput.disabled = true;
            currentVillageInput.disabled = true;
            coinInput.disabled = true;
            discountSelect.disabled = true;

            if (isI18nReady) {
                villageInput.placeholder = t("inputPlaceholderFailed");
                currentVillageInput.placeholder = t("currentVillagePlaceholderFailed");
                coinInput.placeholder = t("coinInputPlaceholderFailed");
            } else {
                villageInput.placeholder = "資料載入失敗";
                currentVillageInput.placeholder = "資料載入失敗";
                coinInput.placeholder = "資料載入失敗";
            }
        }

        function sanitizeNumberInput(value) {
            return String(value || "").replace(/\D/g, "");
        }

        function formatNumber(num) {
            return Number(num).toLocaleString(t("locale"));
        }

        function trimDecimal(value) {
            return Number(value.toFixed(3)).toString();
        }

        function formatCoins(num) {
            const n = Number(num);

            if (!Number.isFinite(n)) return "0 " + t("coins");

            const trillion = 1000000000000;
            const hundredMillion = 100000000;
            const tenThousand = 10000;

            if (currentLang === "zh-Hant" || currentLang === "vi") {
                if (n >= trillion) return trimDecimal(n / trillion) + t("unitTrillion");
                if (n >= hundredMillion) return trimDecimal(n / hundredMillion) + t("unitHundredMillion");
                if (n >= tenThousand) return trimDecimal(n / tenThousand) + t("unitTenThousand");
                return formatNumber(n) + t("unitPlain");
            }

            if (n >= trillion) return trimDecimal(n / trillion) + t("unitTrillion");
            if (n >= 1000000000) return trimDecimal(n / 1000000000) + t("unitBillion");
            if (n >= 1000000) return trimDecimal(n / 1000000) + t("unitMillion");

            return formatNumber(n) + t("unitPlain");
        }

        function showPlainMessage(text, type = "warning") {
            message.textContent = text;
            message.className = "message " + type;
            currentMessageKey = null;
            currentMessageType = type;
            currentMessageParams = {};
        }

        function showMessage(text, type = "error", key = null, params = {}) {
            message.textContent = text;
            message.className = "message " + type;
            currentMessageKey = key;
            currentMessageType = type;
            currentMessageParams = params || {};
        }

        function clearMessage() {
            message.textContent = "";
            message.className = "message";
            currentMessageKey = null;
            currentMessageType = "";
            currentMessageParams = {};
        }

        function showCalcMessage(text, type = "warning") {
            calcMessage.textContent = text;
            calcMessage.className = "calc-message show " + type;
        }

        function clearCalcMessage() {
            calcMessage.textContent = "";
            calcMessage.className = "calc-message";
        }

        function findVillageByNumber(numberText) {
            if (!numberText) return null;

            const villageNumber = Number(numberText);

            if (!Number.isInteger(villageNumber)) return null;

            return villages.find(v => Number(v["編號"]) === villageNumber) || null;
        }

        function handleVillageInput() {
            const cleanValue = sanitizeNumberInput(villageInput.value);

            if (villageInput.value !== cleanValue) {
                villageInput.value = cleanValue;
            }

            if (!cleanValue) {
                lastRenderedVillage = null;
                result.classList.remove("show");
                showMessage(t("enterVillageNumber"), "warning", "enterVillageNumber");
                return;
            }

            const village = findVillageByNumber(cleanValue);

            if (!village) {
                lastRenderedVillage = null;
                result.classList.remove("show");
                console.warn(t("noVillageConsole", { number: cleanValue }));
                showMessage(t("noVillageData"), "error", "noVillageData");
                return;
            }

            renderVillage(village);
        }

        function changeVillageNumber(step) {
            if (villageInput.disabled || villages.length === 0) return;

            const currentValue = sanitizeNumberInput(villageInput.value);
            let currentNumber = Number(currentValue);

            if (!currentValue || !Number.isInteger(currentNumber)) {
                currentNumber = 1;
            }

            let nextNumber = currentNumber + step;

            if (nextNumber < 1) nextNumber = 1;
            if (nextNumber > maxVillageNumber) nextNumber = maxVillageNumber;

            villageInput.value = String(nextNumber);
            handleVillageInput();
        }

        function renderVillage(village) {
            clearMessage();

            lastRenderedVillage = village;

            const total = Number(village["總金幣"]);

            villageNo.textContent = t("villageNo", { number: village["編號"] });
            villageName.textContent = village["名稱"];
            villageCost.textContent = formatCoins(total);
            rawCost.textContent = t("rawCost", { amount: formatNumber(total) });

            discountGrid.innerHTML = "";

            discounts.forEach(discount => {
                const payRate = (100 - discount) / 100;
                const payAmount = Math.round(total * payRate);
                const saveAmount = total - payAmount;

                const card = document.createElement("div");
                card.className = "discount-card";

                card.innerHTML = `
                    <div class="discount">${discount}% off</div>
                    <div class="amount">
                        ${formatCoins(payAmount)}
                        <br>
                        <span class="amount-small">${t("pay", { amount: formatNumber(payAmount) })}</span>
                        <br>
                        <span class="save-small">${t("save", { amount: formatCoins(saveAmount) })}</span>
                    </div>
                `;

                discountGrid.appendChild(card);
            });

            result.classList.add("show");
        }

        function handleCurrentVillageInput() {
            const cleanValue = sanitizeNumberInput(currentVillageInput.value);

            if (currentVillageInput.value !== cleanValue) {
                currentVillageInput.value = cleanValue;
            }

            calculateReachableVillage();
        }

        function handleCoinInput() {
            const cleanValue = sanitizeNumberInput(coinInput.value);

            if (coinInput.value !== cleanValue) {
                coinInput.value = cleanValue;
            }

            calculateReachableVillage();
        }

        function getDiscountedCost(originalCost, discount) {
            const payRate = (100 - discount) / 100;
            return Math.round(Number(originalCost) * payRate);
        }

        function getSelectedDiscountText(discount) {
            if (discount === 0) return t("selectedDiscountNone");
            return t("selectedDiscount", { discount });
        }

        function calculateReachableVillage() {
            if (
                !isI18nReady ||
                currentVillageInput.disabled ||
                coinInput.disabled ||
                villages.length === 0
            ) {
                reachableResult.classList.remove("show");
                clearCalcMessage();
                return;
            }

            const currentVillageValue = sanitizeNumberInput(currentVillageInput.value);
            const coinValue = sanitizeNumberInput(coinInput.value);

            if (!currentVillageValue && !coinValue) {
                reachableResult.classList.remove("show");
                showCalcMessage(t("enterCurrentVillageAndCoins"), "warning");
                return;
            }

            if (!currentVillageValue) {
                reachableResult.classList.remove("show");
                showCalcMessage(t("enterCurrentVillage"), "warning");
                return;
            }

            if (!coinValue) {
                reachableResult.classList.remove("show");
                showCalcMessage(t("enterCoins"), "warning");
                return;
            }

            const startVillageNumber = Number(currentVillageValue);
            const ownedCoins = Number(coinValue);

            if (!Number.isFinite(startVillageNumber) || !Number.isFinite(ownedCoins)) {
                reachableResult.classList.remove("show");
                showCalcMessage(t("enterCurrentVillageAndCoins"), "warning");
                return;
            }

            const startIndex = villages.findIndex(v => Number(v["編號"]) === startVillageNumber);

            if (startIndex === -1) {
                reachableResult.classList.remove("show");
                showCalcMessage(t("currentVillageNotFound"), "error");
                return;
            }

            clearCalcMessage();

            const selectedDiscount = Number(discountSelect.value || 0);

            let spent = 0;
            let completedCount = 0;
            let nextVillageToBuild = villages[startIndex];

            for (let i = startIndex; i < villages.length; i++) {
                const village = villages[i];
                const cost = getDiscountedCost(village["總金幣"], selectedDiscount);

                if (spent + cost <= ownedCoins) {
                    spent += cost;
                    completedCount++;
                    nextVillageToBuild = villages[i + 1] || null;
                } else {
                    nextVillageToBuild = village;
                    break;
                }
            }

            const remaining = ownedCoins - spent;

            const reachableVillageNumber = startVillageNumber + completedCount;
            const reachableVillageData =
                villages.find(v => Number(v["編號"]) === reachableVillageNumber) || null;

            if (completedCount === 0) {
                const currentVillage = villages[startIndex];
                const currentVillageCost = getDiscountedCost(currentVillage["總金幣"], selectedDiscount);
                const shortage = Math.max(currentVillageCost - ownedCoins, 0);
                const formattedShortage = formatCoins(shortage);

                reachableMain.textContent = t("cannotBuildCurrentVillage", {
                    number: currentVillage["編號"],
                    shortage: formattedShortage
                });

                reachableDetail.textContent =
                    getSelectedDiscountText(selectedDiscount) +
                    "｜" +
                    t("currentVillageCost", {
                        cost: formatCoins(currentVillageCost)
                    });

                usedCoins.textContent = formatCoins(0);
                remainingCoins.textContent = formatCoins(ownedCoins);

                nextVillageInfo.textContent = t("nextVillage", {
                    number: currentVillage["編號"],
                    name: currentVillage["名稱"]
                });

                shortCoins.textContent = formattedShortage;

                reachableResult.classList.add("show");
                return;
            }

            if (reachableVillageData) {
                reachableMain.textContent = t("reachableVillage", {
                    number: reachableVillageData["編號"],
                    name: reachableVillageData["名稱"]
                });
            } else {
                reachableMain.textContent = t("noNextVillage");
            }

            reachableDetail.textContent =
                t("buildCountFromCurrent", {
                    start: startVillageNumber,
                    count: completedCount
                }) +
                "｜" +
                getSelectedDiscountText(selectedDiscount);

            usedCoins.textContent = formatCoins(spent);
            remainingCoins.textContent = formatCoins(remaining);

            if (nextVillageToBuild) {
                const nextCost = getDiscountedCost(nextVillageToBuild["總金幣"], selectedDiscount);
                const shortage = Math.max(nextCost - remaining, 0);

                nextVillageInfo.textContent = t("nextVillage", {
                    number: nextVillageToBuild["編號"],
                    name: nextVillageToBuild["名稱"]
                });

                shortCoins.textContent = formatCoins(shortage);
            } else {
                nextVillageInfo.textContent = t("noNextVillage");
                shortCoins.textContent = t("noShortage");
            }

            reachableResult.classList.add("show");
        }

        languageSelect.addEventListener("change", event => {
            currentLang = event.target.value;
            localStorage.setItem("coin999_lang", currentLang);
            applyI18n();
        });

        villageInput.addEventListener("input", handleVillageInput);

        villageInput.addEventListener("keydown", event => {
            if (event.key === "ArrowUp") {
                event.preventDefault();
                changeVillageNumber(1);
            }

            if (event.key === "ArrowDown") {
                event.preventDefault();
                changeVillageNumber(-1);
            }
        });

        currentVillageInput.addEventListener("input", handleCurrentVillageInput);
        coinInput.addEventListener("input", handleCoinInput);
        discountSelect.addEventListener("change", calculateReachableVillage);

        async function init() {
            setInitialLoadingState();
            await loadI18n();

            if (!isI18nReady) {
                return;
            }

            await loadVillages();
        }

        init();
    </script>
</body>

</html>
